name: Update YouTube caches

on:
  schedule:
    # Minute 17 avoids the top-of-hour load peak, when GitHub delays or drops scheduled runs.
    - cron: "17 6 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-cache-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch videos
        run: npm run fetch:videos
        env:
          # Optional secret; without it the fetchers use the anonymous public pages.
          GOOGLE_YT_DATA_API_KEY: ${{ secrets.GOOGLE_YT_DATA_API_KEY }}
      - name: Fetch playlists
        run: npm run fetch:playlists
        env:
          GOOGLE_YT_DATA_API_KEY: ${{ secrets.GOOGLE_YT_DATA_API_KEY }}
      - name: Commit and push updated caches
        run: |
          git add -- cache/youtube-videos.json cache/youtube-playlists.json
          if git diff --cached --quiet; then
            echo "YouTube caches are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aktualisiere YouTube-Videos und Playlists" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
